<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXORA</title>
<style>
:root{--bg:#e9f0f7;--panel:#fff;--ink:#12202e;--muted:#667788;--brand:#3b7bb0;--in:#e8eff6;--line:#dbe4ec;--green:#6fcf3a;--soft:color-mix(in srgb,var(--brand) 14%,var(--panel));--sh:0 8px 24px #1b3b5a14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#0e141a;--panel:#171f27;--ink:#e8eef4;--muted:#93a1af;--in:#222d38;--line:#27323d;--sh:none;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141a;--panel:#171f27;--ink:#e8eef4;--muted:#93a1af;--in:#222d38;--line:#27323d;--sh:none;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}h3{font-size:16px}.mut{color:var(--muted);font-size:13px}
.app{display:grid;grid-template-columns:256px 1fr;height:100%}
.side{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 72%,#06121c),color-mix(in srgb,var(--brand) 30%,#06121c));color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;line-height:1.15;margin-bottom:16px}
.logo small{display:block;font-size:9px;letter-spacing:1.2px;opacity:.7;font-weight:600;text-transform:uppercase}
.lg{width:42px;height:42px;border-radius:14px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:900}
.ni{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;color:#dbe9f5;font-weight:600;width:100%;text-align:left}
.ni:hover{background:#ffffff1f}.ni.on{background:#fff;color:var(--brand);box-shadow:0 4px 14px #0004}
.sp{flex:1}
.mini{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.mini h4{margin:0;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.mc{background:#ffffff1f;border-radius:14px;padding:9px 12px;font-size:12.5px}.mc b{display:block;font-size:13px}.mc span{opacity:.8}
.main{overflow:auto;padding:0 28px 28px;min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:16px 0;background:var(--bg)}
.top h1{font-size:22px}.burger{display:none;font-size:22px}
.chip{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:30px;padding:5px 14px 5px 5px;box-shadow:var(--sh);text-align:left}

.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;position:relative;font-size:14px}
.av.on::after{content:"";position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--panel)}
.av.big{width:76px;height:76px;font-size:28px}
.btn{background:var(--brand);color:#fff;border-radius:14px;padding:9px 18px;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 40%,transparent)}
.btn.sm{padding:6px 14px;font-size:13px}.btn.lt{background:#fff;color:var(--brand)}.btn.ok{background:var(--green);color:#10260a;box-shadow:none}.btn.danger{background:#d1495b}.btn:disabled{opacity:.6;cursor:default}
.gh{padding:6px 12px;color:var(--muted);font-weight:600}.lk{color:var(--brand);font-weight:700;font-size:13px;margin-left:8px}
.hi{font-size:20px;font-weight:700;margin-bottom:16px}.hi span{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 320px;gap:22px}.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card,.card0{background:var(--panel);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}.col .card{margin:0}
.card h3{margin-bottom:12px}
.hero{border-radius:24px;padding:26px;color:#fff;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 50%,#7fd1ff));position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero h2{font-size:26px}.hero p{margin:4px 0 14px;opacity:.9}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff22}
.orb{font-size:64px;z-index:1}
.sec h3{margin-bottom:10px}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rc{background:var(--panel);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;transition:.15s}.rc:hover{transform:translateY(-3px)}
.rc i,.rcard i{font-style:normal;font-size:30px}.rc b{font-size:14px}.rc small{color:var(--muted);font-size:12px}
.live{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:10px}

.li{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:20px}
.lib{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tile{width:62px;height:62px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:28px;border:3px solid color-mix(in srgb,var(--green) 40%,transparent)}
.items{display:flex;flex-direction:column;gap:8px;overflow:auto}
.it{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--soft);text-align:left;width:100%}
.it.sel{background:var(--brand);color:#fff}.im{flex:1;min-width:0}
.in{display:flex;justify-content:space-between;gap:6px}.in time{font-size:11px;opacity:.75}
.ip{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--green);color:#10260a;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px}
.rm{padding:8px 0;border-bottom:1px solid var(--line)}.rm:last-child{border:0}.rm b{display:block;font-size:14px}.rm small{color:var(--muted)}
.empty{text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}.empty h2{color:var(--ink)}.big{font-size:56px}
.bar2{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.inp,.f input,.f textarea,.f select,.ti{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;outline:none;min-width:0}
.inp{flex:1;min-width:200px}.inp:focus,.f input:focus,.f textarea:focus{border-color:var(--brand)}
.chips2{display:flex;gap:8px;flex-wrap:wrap}.ch{padding:7px 16px;border-radius:20px;background:var(--panel);font-weight:600;font-size:13px;box-shadow:var(--sh)}.ch.on{background:var(--brand);color:#fff}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.rcard{background:var(--panel);border-radius:20px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rcard p{color:var(--muted);font-size:13px;flex:1}.tag{background:var(--soft);border-radius:14px;padding:2px 10px;font-size:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;align-items:end}.g2{grid-column:1/-1}.fr .btn{grid-column:1/-1;justify-self:start}
.rw{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.rw:last-child{border:0}.rw div{flex:1}.rw.dn b{text-decoration:line-through;opacity:.5}.od{color:#d1495b;font-size:12px;font-weight:700}
.rw input{width:20px;height:20px;accent-color:var(--brand)}
.chats{display:grid;grid-template-columns:320px 1fr;gap:16px;height:calc(100dvh - 110px);min-height:420px}
.chats .card0{margin:0;display:flex;flex-direction:column;min-height:0;padding:14px}.ch0{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cthread{padding:0!important;overflow:hidden}.th{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.th>div:nth-child(3){flex:1}.th small{color:var(--muted)}
.back{display:none;font-size:22px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:min(75%,520px);padding:9px 13px;border-radius:18px;background:var(--in);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap;border-bottom-left-radius:5px}
.b.me{align-self:flex-end;background:var(--brand);color:#fff;border-radius:18px 18px 5px 18px}
.b .w{display:block;font-size:11px;font-weight:700;color:var(--brand);margin-bottom:2px}.b .t{display:block;font-size:10.5px;opacity:.7;text-align:right}
.typ{padding:0 18px;min-height:20px;color:var(--muted);font-size:12.5px}
.comp{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.comp textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:10px 16px;font:inherit;outline:none}
.send{background:var(--brand);color:#fff;border-radius:50%;width:42px;height:42px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:920px}.pg .card{margin:0}.w{grid-column:1/-1}
.hero2{display:flex;gap:16px;align-items:center}.pnm{font-size:20px}
.bar{height:8px;background:var(--in);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.sw button{width:28px;height:28px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tags .tag button{margin-left:4px;opacity:.7}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600}details p{margin-top:6px;color:var(--muted)}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.flow b{background:var(--soft);padding:7px 14px;border-radius:14px;font-size:13px}.ar{color:var(--muted)}
.wfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:16px}
.wf{background:var(--panel);border:2px solid var(--muted);border-radius:12px;overflow:hidden}.wfh{background:var(--in);padding:6px 12px;font-weight:700;font-size:12px;border-bottom:2px solid var(--muted)}
.wfb{display:flex;gap:8px;padding:8px}.wfs{width:46px;display:flex;flex-direction:column;gap:6px}.wfs i{height:14px;border-radius:7px;background:var(--in);border:1.5px dashed var(--muted)}
.wfm{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}.wr{display:flex;gap:8px}
.wc{border:1.5px dashed var(--muted);background:var(--in);border-radius:8px;display:grid;place-items:center;font-size:10.5px;color:var(--muted);text-align:center;padding:2px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:40;padding:16px}
.mdl{background:var(--panel);border-radius:22px;padding:22px;width:min(420px,100%);box-shadow:0 20px 60px #0006}.mdl h3{margin-bottom:12px}.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#out{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,var(--brand),#0d2236);display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:18px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}.toast.on{opacity:1}
.scrim{display:none}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.main{padding:0 14px 20px}
 .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:.25s}.side.show{transform:none}
 .side.show+.scrim{display:block;position:fixed;inset:0;background:#0006;z-index:25}
 .burger{display:block}.grid2,.pg,.fr{grid-template-columns:1fr}.recs{grid-template-columns:1fr}
 .chip span{display:none}.chip{padding:5px}
 .chats{grid-template-columns:1fr}.chats.tv .clist,.chats:not(.tv) .cthread{display:none}.back{display:block}.b{max-width:88%}
}
</style>
</head>
<body>

 <aside class="side" id="side">

 </main>
</div>

<script>
const $=s=>document.querySelector(s);

const K=k=>k==="cc_chats2"?"vx_chats":k;

const col=n=>COL[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const ini=n=>n.split(/[\s.]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"S";
const av=(n,on,c,x)=>`<div class="av${on?" on":""}${x?" big":""}" style="background:${c||col(n)}">${esc(ini(n))}</div>`;

if(!CH){const ts=now();CH=[{id:1,name:"Physics Study Group",grp:true,on:true,un:0,who:["Sami","Olivia"],u:Date.now(),m:[{me:0,w:"Sami",t:"Hey team! Revising electromagnetics at 8 tonight, who’s in?",ts},{me:1,t:"I’m in! Can someone share the Maxwell’s equations notes?",ts},{me:0,w:"Olivia",t:"Sure, I’ll post them here in a minute 📚",ts}]}];sv("cc_chats2",CH)}
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=r=>new Date(r.d+"T"+(r.tm||"00:00")).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})+(r.tm?" · "+r.tm:"");
const upc=()=>RM.filter(r=>!r.done).sort((a,b)=>(a.d+(a.tm||"")).localeCompare(b.d+(b.tm||"")));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1400)};
const R=["Sounds good, thanks!","Can you share your notes from today?","I’m free after 6, want to study together?","Great point, I hadn’t thought of that.","Just posted the answers in the Resource Corner 📚","Let’s do a quick revision session tonight.","Haha same, that chapter was rough 😅"];
const RES=[
{id:"r1",t:"Calculus Maths",c:"Maths",e:"📐",d:"A guide and basic steps you need to know.",k:"math calculus"},
{id:"r2",t:"Dev. Biology",c:"Science",e:"🧬",d:"Study how animals and plants grow.",k:"biology science"},
{id:"r3",t:"Creative Writing",c:"Writing",e:"✍️",d:"Essays, articles and writing tips.",k:"writing english"},
{id:"r4",t:"Principles of Electromagnetics",c:"Science",e:"🧲",d:"Fields, waves and Maxwell’s equations.",k:"physics electromagnetics"},
{id:"r5",t:"Macro Economics",c:"Economics",e:"📈",d:"Growth, inflation and policy basics.",k:"economics"},
{id:"r6",t:"Linear Algebra Workbook",c:"Maths",e:"🧮",d:"Matrices, vectors and practice sets.",k:"math algebra"},
{id:"r7",t:"Organic Chemistry Notes",c:"Science",e:"⚗️",d:"Reactions and mechanisms made simple.",k:"chemistry"},
{id:"r8",t:"Academic Essay Toolkit",c:"Writing",e:"📝",d:"Structure, citations and an editing checklist.",k:"writing essay"},
{id:"r9",t:"Intro to Cosmology",c:"Science",e:"🌌",d:"From the Big Bang to dark matter.",k:"physics cosmology astronomy"}];
const LS=[{id:"l1",t:"Principles of Electromagnetics",e:"💡",time:"● Live now"},{id:"l2",t:"Macro Economics",e:"✒️",time:"Starts in 20 min"}];
const sc=r=>P.tg.filter(t=>r.k.split(" ").some(w=>w.includes(t)||t.includes(w))).length;
const NAV=[["home","🏠","Home"],["res","📚","Resource Corner"],["chats","💬","Chats"],["live","🎥","Live Chat"],["rem","🔔","Reminders"],["prof","👤","My Profile"],["wire","🧩","UX Wireframe"]];
const NAV2=[["set","⚙️","Settings"],["help","🛟","Help"]];

function navR(){$("#nav").innerHTML=NAV.map(ni).join("");$("#nav2").innerHTML=NAV2.map(ni).join("")+'<button class="ni" data-a="out"><span>↪</span>Sign out</button>'}

function applyP(){const r=document.documentElement;r.style.setProperty("--brand",P.ac);P.th==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",P.th);const n=P.n||"Student";$("#me").innerHTML=av(n,P.on,P.ac)+`<span><b>${esc(n)}</b><small>${esc(P.st)}</small></span>`}

function modal(h){const m=$("#modal");m.innerHTML='<div class="mdl">'+h+"</div>";m.hidden=false}
const V={},A={};
V.home=()=>{
 const rec=[...RES].sort((a,b)=>sc(b)-sc(a)).slice(0,3),up=upc().slice(0,3),L=[...CH].sort((a,b)=>b.u-a.u).slice(0,4);
 $("#view").innerHTML=`<p class="hi">Hi, ${esc(P.n||"there")} 👋<span>Here’s what’s happening in your circle today.</span></p>
 <div class="grid2"><div class="col">
